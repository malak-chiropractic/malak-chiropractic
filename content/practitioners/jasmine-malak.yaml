short: Jasmine is a Macquarie University–trained chiropractor who combines careful assessment with hands-on care and practical rehabilitation. She takes time to explain what she finds and works with you on a plan that fits your goals.
bio: |-
  Jasmine completed her Bachelor of Chiropractic Science and Master of Chiropractic at Macquarie University. Her approach is calm, thorough and collaborative: she believes good care starts with listening, and that people do best when they understand what's going on and what they can do about it.

  In clinic, Jasmine draws on Diversified and Thompson techniques, dry needling, soft tissue therapy and Pilates-based core activation, selecting each only where it suits your presentation and preferences. Exercise and education are part of most plans, so you leave with something useful to do between visits.

  Working within Panania Family Doctors, Jasmine values close communication with GPs and other health professionals, and refers on whenever another pathway is more appropriate.

  Jasmine is a member of the Australian Chiropractors Association. She also works as a locum chiropractor in clinics around Australia, which keeps broadening her clinical experience.
philosophy: Care should be individual, honest and easy to understand. My role is to assess carefully, explain clearly and help you build confidence in your own body.
