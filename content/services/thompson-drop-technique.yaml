title: Thompson Drop-Piece Technique
order: 5
icon: table
summary: A lower-force manual technique using a specialised segmented table — an option for people who prefer a gentler approach.
seoTitle: Thompson Drop-Piece Technique in Panania
seoDescription: Thompson Drop-Piece Technique at Malak Chiropractic, Panania — a lower-force chiropractic technique using a segmented table. What it involves and who it may suit.
involves: |-
  Thompson Drop-Piece Technique uses a chiropractic table with sections that can be raised slightly and then drop a small distance when a quick, gentle thrust is applied. The drop is designed to reduce the force needed for the technique.

  Many people find it comfortable, and it is typically quieter than other forms of manipulation, without the twisting positions some people find uncomfortable.
considered: |-
  Thompson Technique may be considered as an option for some people with spinal or pelvic discomfort who:
  - Prefer a lower-force approach
  - Are uncomfortable with rotational manipulation
  - Have presentations where reduced force is clinically preferable

  Research specific to drop-piece technique is more limited than for spinal manipulation in general. We use it as one option within a broader plan, alongside exercise and education.
expect: |-
  - You'll usually lie face down on the segmented table, fully clothed
  - You may hear the table section drop with a light "click"
  - Sensations are usually brief and mild
suitability: |-
  As with all techniques, we'll only recommend Thompson Technique if your assessment suggests it's appropriate and you're comfortable with it.
precautions: |-
  Some conditions, such as recent fractures, severe osteoporosis or acute inflammatory conditions, may mean this or other manual techniques aren't appropriate. Positioning can be adapted for pregnancy or limited mobility where suitable.
faqs:
  - q: Is Thompson Technique safer than other manipulation?
    a: It uses less force, which some people prefer, but every technique has benefits and risks. We'll discuss what's most appropriate for you.
  - q: Do I need to undress?
    a: No. Treatment is performed fully clothed.
