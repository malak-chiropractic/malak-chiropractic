title: Chiropractic Consultations
order: 1
icon: consult
summary: A thorough assessment of your musculoskeletal concern, a clear explanation of what we find, and a plan built around your goals.
seoTitle: Chiropractic Consultations in Panania
seoDescription: Individualised chiropractic assessment and care in Panania, Sydney. Thorough history, examination, clear explanations and conservative management planned around your goals.
involves: |-
  Every course of care begins with a consultation. We'll talk through your concern in detail — when it started, what makes it better or worse, how it affects your day, and your general health history — before a physical and neurological examination.

  We'll then explain what we think is going on in plain language, discuss your options (including the option of not having treatment, or seeing someone else) and agree on a plan together. Treatment may include spinal manipulation using Diversified Technique, lower-force options such as Thompson Drop-Piece Technique, soft tissue therapy, dry needling and exercise — chosen only where they suit you.
considered: |-
  People commonly see a chiropractor for musculoskeletal concerns such as:
  - Neck and back pain, whether recent or long-standing
  - Stiffness or reduced movement in the spine or joints
  - Some types of headache associated with the neck
  - Discomfort related to work, posture or activity
  - Wanting guidance on exercise and self-management

  Chiropractic care isn't the right fit for every concern. Part of the consultation is working out whether it is right for you.
expect: |-
  - A conversation first: you'll have time to explain your concern in your own words
  - A physical examination, which may include movement testing, orthopaedic tests and a neurological screen
  - A clear explanation of findings and options, including likely timeframes and costs
  - Treatment on the day only if it's clinically appropriate and you consent
  - Practical advice and exercises to use at home
suitability: |-
  Suitability is determined by your history and examination. We look for features that suggest a concern is likely to respond to conservative care, and for features that need medical assessment first. If imaging, blood tests or another opinion is needed, we'll explain why and coordinate with your GP.
precautions: |-
  Spinal manipulation is not suitable for everyone. Conditions such as fractures, severe osteoporosis, some inflammatory or vascular conditions, cancer and certain neurological signs may make particular techniques inappropriate.

  Mild, short-lived soreness or stiffness after treatment is common. Serious complications are rare, but they have been reported. We'll discuss the risks and benefits relevant to you, and you can ask questions or change your mind at any time.
faqs:
  - q: Do I need a referral to see a chiropractor?
    a: No. You can book directly. A GP referral is only needed if you are accessing Medicare rebates under a GP Chronic Condition Management Plan, or for workers compensation and DVA arrangements.
  - q: Will I be treated at my first appointment?
    a: Often, yes — but only if the assessment suggests treatment is appropriate and you're comfortable to go ahead. Sometimes the right first step is a referral or further tests.
  - q: Do I have to have my neck or back "cracked"?
    a: No. Manipulation is one option among many. If you'd prefer not to have it, we'll discuss lower-force and exercise-based alternatives.
