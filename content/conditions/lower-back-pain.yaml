title: Lower back pain
photo: /images/photos/lower-back-sofa.webp
photoAlt: A man getting up from a sofa with a hand on his lower back
illustration: /images/conditions/lower-back-pain.svg
region: lumbar
order: 2
summary: Lower back pain affects most people at some point. In most cases it isn't caused by serious damage, and staying active helps.
overview: Around 90% of lower back pain is classified as non-specific — there is no identifiable serious cause. Pain can be intense without meaning something is badly damaged. Most acute episodes improve substantially within six weeks, although some people experience recurrent or persistent pain.
symptoms: '- Aching, sharp or stiff sensations across the lower back

  - Pain with bending, lifting, sitting or getting out of bed

  - Muscle spasm or guarding

  - Pain that may spread into the buttock or thigh'
contributors: '- Sudden increases in load or unfamiliar activity

  - Prolonged sitting or reduced overall activity

  - Poor sleep, stress and low mood

  - General fitness and previous episodes of back pain'
care: 'We assess your history, movement, strength and nerve function, and screen for signs of serious pathology. Care is aligned with Australian and international guidelines: reassurance and education, staying active, exercise therapy, and manual therapy where appropriate as part of a broader plan. Routine imaging is generally not recommended unless serious pathology is suspected.'
redFlags: '- Loss of bladder or bowel control, or numbness around the groin or buttocks (seek emergency care)

  - Progressive leg weakness or numbness

  - Back pain with fever, feeling unwell, or a history of cancer

  - Back pain after significant trauma, or with known osteoporosis

  - Severe pain at night that does not ease with rest or change of position'
