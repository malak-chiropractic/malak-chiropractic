title: Tennis elbow (lateral elbow pain)
illustration: /images/conditions/tennis-elbow.svg
region: peripheral
order: 7
summary: Pain on the outside of the elbow with gripping and lifting — one of the most common concerns we see, and one that responds well to an active, hands-on plan for many people.
overview: Tennis elbow (lateral elbow tendinopathy) is pain where the forearm extensor tendons attach to the outer elbow. It usually follows a change in load — work, DIY, sport or long hours on a mouse — and can persist for months without the right approach. Pain at the outer elbow can also be referred from the neck, so assessment looks at both.
symptoms: '- Pain on the outer elbow, sometimes into the forearm

  - Pain gripping, lifting with the palm down, shaking hands or turning a doorknob

  - Reduced grip strength'
contributors: '- Repetitive gripping or wrist extension (tools, trades, racquet sports, keyboard and mouse)

  - Sudden increases in workload or activity

  - Reduced strength in the forearm, shoulder and upper back'
care: Systematic reviews show dry needling can reduce pain and improve function and grip strength, particularly in the short term, and that manipulation of the neck and upper back added to exercise can provide short- to mid-term benefit. Care at Malak Chiropractic may combine dry needling, manual therapy to the neck, upper back, ribs, shoulder and elbow, and a progressive strengthening program — chosen after assessment and with your consent.
redFlags: '- Elbow pain after a fall or significant injury

  - A hot, red or swollen elbow, or fever

  - Numbness or pins and needles in the hand

  - Locking or inability to straighten the elbow'
