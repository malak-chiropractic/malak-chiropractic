title: Mid-back discomfort
illustration: /images/conditions/mid-back-pain.svg
region: thoracic
order: 3
summary: Discomfort between the shoulder blades or around the ribs is often linked to posture, sustained positions or muscle strain.
overview: The thoracic spine is designed for stability and rotation, and connects with the ribs. Mid-back discomfort is often musculoskeletal, but because organs in the chest and abdomen can refer pain to this area, a careful history matters.
symptoms: '- Ache or tightness between the shoulder blades

  - Stiffness when twisting or taking a deep breath

  - Tender spots in the upper back muscles'
contributors: '- Long periods sitting or looking at screens

  - Repetitive lifting or carrying

  - Reduced thoracic mobility'
care: Assessment includes posture and movement analysis, rib and spinal examination, and screening for non-musculoskeletal causes. Management may include mobility exercises, strengthening, soft tissue therapy, manipulation where suitable, and ergonomic advice.
redFlags: '- Chest pain, shortness of breath, or pain spreading to the jaw or arm (call 000)

  - Pain with fever, unexplained weight loss or night sweats

  - Pain after trauma or with known osteoporosis'
