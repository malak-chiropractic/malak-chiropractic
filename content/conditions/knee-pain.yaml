title: Knee pain
illustration: /images/conditions/knee-pain.svg
region: peripheral
order: 9
summary: Many types of knee pain respond well to graded strengthening and load management.
overview: Knee pain is common in active and less active people alike. Presentations range from pain at the front of the knee with stairs and squatting, to tendon-related pain and age-related joint changes. Exercise is a well-supported part of managing many knee conditions, including knee osteoarthritis.
symptoms: '- Pain going up or down stairs, squatting or kneeling

  - Stiffness after sitting

  - Swelling or a feeling of the knee giving way (needs assessment)'
contributors: '- Rapid changes in activity or training

  - Strength and control around the hip and knee

  - Previous injury'
care: Assessment of the knee, hip and foot, followed by a graded strengthening plan, activity advice and, where appropriate, manual therapy. Acute injuries with swelling or instability may need medical or orthopaedic review first.
redFlags: '- A hot, red, swollen knee or fever

  - Inability to bear weight after injury

  - Calf pain and swelling (possible blood clot — see a doctor urgently)

  - Locking that prevents straightening the knee'
