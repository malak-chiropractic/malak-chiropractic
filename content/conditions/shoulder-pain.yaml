title: Shoulder discomfort
region: peripheral
order: 6
summary: Shoulder pain can come from the shoulder itself or be referred from the neck. Assessment helps find out which.
overview: The shoulder is a highly mobile joint that relies on muscles and tendons for support. Common presentations include rotator cuff-related shoulder pain and stiffness. Pain felt in the shoulder can also be referred from the neck, and occasionally from internal organs.
symptoms: '- Pain lifting the arm or reaching behind your back

  - Aching at night or when lying on the shoulder

  - Stiffness or reduced movement

  - Pain spreading from the neck to the shoulder blade or arm'
contributors: '- Changes in load, such as new exercise or lifting

  - Repetitive overhead activity

  - Neck-related referral'
care: We assess both the neck and shoulder, then build a plan that commonly centres on progressive strengthening and movement, supported by manual therapy where appropriate. Some shoulder conditions need imaging or medical management, and we'll refer if so.
redFlags: '- Shoulder pain with chest pain or shortness of breath (call 000)

  - Sudden inability to lift the arm after a fall

  - A hot, swollen joint or fever

  - Unexplained weight loss or night pain'
relatedArticles:
- exercise-persistent-pain
relatedServices:
- rehabilitation-exercise
- dry-needling
