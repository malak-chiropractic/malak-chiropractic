title: Some types of headache
illustration: /images/conditions/headaches.svg
region: cervical
order: 4
summary: Some headaches are associated with the neck. Others need medical assessment. Telling the difference comes first.
overview: There are many types of headache. Cervicogenic headache — headache referred from structures in the neck — and some tension-type headaches may involve neck muscles and joints. Migraine and other headache types have different mechanisms. Chiropractic assessment can help identify whether neck-related factors are contributing, and when medical review is the better step.
symptoms: '- Headache that starts at the base of the skull and spreads forward

  - Headache associated with neck stiffness or particular neck positions

  - Tightness or pressure around the head'
contributors: '- Sustained neck postures

  - Muscle tension and stress

  - Poor sleep

  - Previous neck injury'
care: We take a detailed headache history and examine the neck, and screen for features that need medical assessment. Where neck-related factors appear relevant, care may include exercise, manual therapy and advice. We'll refer you to your GP if your headaches don't fit a musculoskeletal pattern.
redFlags: '- Sudden, severe ''worst ever'' headache (call 000)

  - Headache with fever, stiff neck and rash

  - Headache with confusion, weakness, vision changes or difficulty speaking

  - New headaches after age 50, or a change in your usual pattern

  - Headache after a head injury'
