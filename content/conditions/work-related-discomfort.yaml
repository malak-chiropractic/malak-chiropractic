title: Postural and work-related discomfort
region: thoracic
order: 10
summary: Discomfort from desk work, driving or physical jobs is usually about load and variety — not a single 'perfect posture'.
overview: There is no single correct posture. Discomfort tends to build when we stay in any one position too long, or when work demands exceed our current capacity. Small changes to set-up, movement breaks and building strength often make a meaningful difference. We also work with NSW workers compensation (SIRA) claims.
symptoms: '- Neck, shoulder or upper back tension towards the end of the day

  - Lower back stiffness after sitting or driving

  - Wrist or forearm discomfort with computer use'
contributors: '- Prolonged static positions

  - Repetitive tasks and limited breaks

  - Workstation set-up

  - Stress and workload'
care: 'We look at your work demands and set-up, assess the areas involved, and focus on practical changes: movement variety, targeted strengthening and mobility, and manual therapy where helpful.'
redFlags: '- Numbness or weakness in the hands

  - Symptoms that continue to worsen despite changes

  - Pain associated with a workplace injury — report it to your employer and see your GP'
