title: Neck pain
illustration: /images/conditions/neck-pain.svg
region: cervical
order: 1
summary: Neck pain is very common and usually not serious. Understanding what's contributing to it helps guide sensible care.
overview: Most neck pain is described as 'non-specific', meaning no single structure can be identified as the cause and there is no sign of serious disease. It may come on after sleeping awkwardly, long periods at a desk, a minor strain, or for no obvious reason. Most episodes improve within weeks, although recurrences are common.
symptoms: '- Aching or stiffness in the neck, sometimes spreading to the shoulders or upper back

  - Reduced range of motion, such as difficulty checking a blind spot

  - Headache that seems to start at the base of the skull

  - Occasionally, pain, tingling or numbness spreading into an arm'
contributors: '- Sustained postures and long periods without movement

  - Recent changes in activity, workload or sleep

  - Stress and reduced sleep quality, which can increase pain sensitivity

  - Previous neck injury, including whiplash'
care: Assessment includes a history, movement testing and a neurological screen. Depending on findings and your preferences, care may include advice and reassurance, exercise, soft tissue therapy, mobilisation or manipulation, dry needling, and guidance on work set-up. Guidelines recommend staying active and using exercise as a core part of management.
redFlags: '- Neck pain after significant trauma, such as a fall or car accident

  - Neck pain with fever, unexplained weight loss or a history of cancer

  - Progressive weakness, clumsiness of the hands or problems with walking or balance

  - Sudden severe headache, dizziness, double vision, difficulty speaking or swallowing'
