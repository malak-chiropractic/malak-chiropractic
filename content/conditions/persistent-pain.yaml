title: Persistent musculoskeletal pain
illustration: /images/conditions/persistent-pain.svg
region: lumbar
order: 11
summary: Pain lasting beyond three months is complex. Understanding pain and building capacity are central to managing it well.
overview: Persistent (chronic) pain is pain that continues for more than three months. It involves changes in how the nervous system processes signals, and is influenced by sleep, stress, mood, activity and past experiences — not just tissue changes. Persistent pain is real, and there are effective, active ways to manage it.
symptoms: '- Pain lasting longer than three months, which may fluctuate

  - Pain that spreads or changes location

  - Increased sensitivity to movement or touch

  - Fatigue, poor sleep and reduced activity'
contributors: '- Nervous system sensitisation

  - Sleep, stress and mood

  - Deconditioning and fear of movement

  - Previous injury or episodes of pain'
care: Care focuses on understanding your pain, setting meaningful goals, and gradually building activity and strength. Manual therapy may be used to support movement. We often work alongside GPs, psychologists and other practitioners as part of a team approach.
redFlags: '- New or very different symptoms

  - Unexplained weight loss, fever or night sweats

  - Progressive weakness or numbness

  - Feeling persistently low or hopeless — please talk to your GP, or call Lifeline on 13 11 14'
