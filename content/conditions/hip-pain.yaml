title: Hip discomfort
region: pelvis
order: 8
summary: Hip-region pain may arise from the hip joint, surrounding tendons, the pelvis or the lower back.
overview: Pain around the hip can be felt in the groin, the side of the hip or the buttock. Each pattern suggests different structures. Lower back and sacroiliac joint problems can also refer pain to the hip region.
symptoms: '- Groin pain, particularly with walking or getting in and out of the car

  - Pain on the outside of the hip when lying on that side

  - Buttock pain with sitting or climbing stairs

  - Stiffness after rest'
contributors: '- Changes in walking, running or training load

  - Reduced strength around the hip

  - Lower back or pelvic involvement'
care: Assessment includes the hip, pelvis and lower back. Management is commonly exercise-led, with education and manual therapy where suitable. Some hip conditions benefit from imaging or orthopaedic opinion, and we'll refer when appropriate.
redFlags: '- Inability to bear weight after a fall

  - Hip pain with fever or feeling unwell

  - Hip pain in children with a limp (see a GP promptly)

  - History of cancer with new hip or groin pain'
