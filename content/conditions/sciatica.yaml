title: Sciatica-like symptoms
photo: /images/photos/sciatica-bed.webp
photoAlt: A woman sitting on the edge of a bed with a hand on her hip and thigh
illustration: /images/conditions/sciatica.svg
region: lumbar
order: 5
summary: Pain spreading down the leg has several possible causes. Assessment helps clarify what's involved and what to watch for.
overview: '''Sciatica'' is commonly used to describe pain travelling from the lower back or buttock into the leg. True radicular pain involves irritation of a nerve root, often accompanied by pins and needles, numbness or weakness. Leg pain can also be referred from the joints and muscles of the lower back and pelvis. Many people with nerve-related leg pain improve over weeks to months with conservative care.'
symptoms: '- Pain spreading into the buttock, thigh, calf or foot

  - Pins and needles or numbness in the leg

  - Pain aggravated by sitting, bending or coughing

  - Leg weakness (needs prompt assessment)'
contributors: '- Disc-related changes irritating a nerve root

  - Narrowing of the spaces where nerves exit the spine

  - Referred pain from lower back or pelvic structures'
care: A thorough neurological assessment is essential. Care may include education, activity modification, exercise and manual therapy where appropriate. We'll coordinate with your GP if medication, imaging or specialist review is needed.
redFlags: '- Loss of bladder or bowel control or numbness around the groin (seek emergency care)

  - Rapidly worsening leg weakness or foot drop

  - Symptoms in both legs

  - Severe, unrelenting pain'
