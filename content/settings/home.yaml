heroEyebrow: Chiropractic · Panania, Sydney
heroHeadline: Care that moves with you.
heroText: Individualised chiropractic care with a conservative, considered approach to musculoskeletal health.
introHeading: Your care should make sense to you.
introText: We take the time to understand your concerns, explain what we find and discuss options that suit your goals. Care is conservative, evidence-informed and planned around you, with referral to other health professionals whenever that is the better path.
principles:
  - title: Individualised assessment
    text: A thorough history and examination, so recommendations are based on your presentation rather than a template.
  - title: Conservative care
    text: Non-invasive, hands-on and exercise-based options, chosen only where they are clinically appropriate.
  - title: Evidence-informed decisions
    text: Clinical reasoning guided by current research, your preferences and our experience — in that combination.
  - title: Goals you set
    text: Whether that's sleeping through the night or getting back to the garden, your goals shape the plan.
  - title: Movement and rehabilitation
    text: Practical exercise and education so you feel confident managing your own musculoskeletal health.
  - title: Working with your GP
    text: Clear communication with your other practitioners, and referral when another pathway is more appropriate.
